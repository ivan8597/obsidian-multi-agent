name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate lock file
        run: uv lock --check

      - name: Install project and development dependencies
        run: uv sync --locked --extra dev

      - name: Compile Python modules
        run: uv run python -m compileall -q src tests evaluation

      - name: Run tests
        run: uv run pytest -q

      - name: Run evaluation smoke check
        run: uv run python -m evaluation.evaluate --predictions evaluation/predictions.example.json

      - name: Run Ruff
        run: uv run ruff check src tests evaluation

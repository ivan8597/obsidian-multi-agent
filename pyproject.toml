[project]
name = "obsidian-multi-agent"
version = "0.1.0"
description = "Local multi-agent RAG assistant for Obsidian and web research"
requires-python = ">=3.11,<3.13"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "ddgs>=9.0.0",
  "python-dotenv>=1.0.1",
  "faiss-cpu>=1.8.0",
  "gradio>=5.0.0",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-ollama>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "langgraph>=0.2.0",
  "langgraph-supervisor>=0.0.29",
  "langgraph-memanto>=0.1.1",
  "memanto>=0.2.16",
  "requests>=2.32.0",
  "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[project.scripts]
obsidian-agent = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
